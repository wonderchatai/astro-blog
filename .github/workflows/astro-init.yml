name: Initialize Astro Project

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to commit to'
        required: true
        default: 'main'

jobs:
  initialize-astro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0 # Fetch all history for git operations

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Astro
        run: npm install -g astro

      - name: Create Astro project
        run: astro add --yes tailwind && astro init --yes --strict

      - name: Add Astro-specific .gitignore rules
        run: |
          echo "" >> .gitignore # Add a newline for separation if file exists
          echo "# Astro related ignores" >> .gitignore
          echo "node_modules/" >> .gitignore
          echo ".DS_Store" >> .gitignore
          echo "dist/" >> .gitignore
          echo "build/" >> .gitignore
          echo ".env" >> .gitignore
          echo ".astro/" >> .gitignore
          echo "package-lock.json" >> .gitignore
          echo "yarn.lock" >> .gitignore
          echo "npm-debug.log" >> .gitignore
          echo ".vscode/" >> .gitignore
          echo "*.log" >> .gitignore
          echo "*.tsbuildinfo" >> .gitignore

      - name: Stage and Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: Initialize Astro project"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        run: git push origin ${{ github.event.inputs.branch_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
